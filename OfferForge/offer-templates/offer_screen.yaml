# Полный экран оффера — то, что видит игрок.
#
# Собирается ТОЛЬКО из элементов, вырезанных из игрового скина
# (экран «Сегментация UI»). Генератор изображений сюда не допускается
# вообще: он рисует лишь арт внутри слотов.
#
# Панель теперь несёт всё окружение сразу — ленту заголовка, крестик,
# бежевую рамку и футер «SET 4/10». Поэтому отдельных слоёв для них нет:
# они уже в файле панели. Сверху докладываются только заголовок (текст),
# прогресс-бар и сетка карточек с их содержимым.
#
# Холст повторяет пропорции панели (≈1.50), чтобы она заполняла его без
# полей по бокам.

id: offer_screen
name: Экран оффера (панель + сетка)
canvas_w: 2740
canvas_h: 1822
background: "#00000000"

layers:
  # Панель — весь фон оффера: рамка, лента, крестик, футер уже в ней.
  - id: panel
    kind: part
    part: panel
    z: 0
    box: { x: 0, y: 0, w: 2740, h: 1822 }

  # Заголовок ложится на ленту, встроенную в панель.
  - id: ribbon_title
    kind: text
    z: 35
    text_slot: set_title
    box: { x: 760, y: 40, w: 1220, h: 120 }
    style:
      size: 82
      color: "#FFE9A8"
      stroke_color: "#6B2E05"
      stroke_width: 7
      align: center
      uppercase: true
      max_lines: 1

  # Прогресс-бар — в верхней части синего поля, над сеткой.
  - id: progress
    kind: part
    part: progress
    z: 30
    box: { x: 760, y: 330, w: 1230, h: 156 }

  # Десять слотов внутри синего поля, ниже прогресс-бара.
  - id: cards
    kind: template
    template: card
    z: 10
    repeat_for: elements
    grid: [5, 2]
    gap: 20
    box: { x: 285, y: 520, w: 2170, h: 1075 }
