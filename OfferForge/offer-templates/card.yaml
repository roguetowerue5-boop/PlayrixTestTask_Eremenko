# Одна коллекционная карточка.
#
# Два применения:
#   1. Режим доводки — выбери этот шаблон и 1 вариант, получишь ОДНО
#      изображение за прогон. Правки стиля и промптов проверяются за
#      секунды и центы, а не за десять генераций.
#   2. Кирпич набора — card_set вставляет этот же шаблон в каждую ячейку
#      через kind: template, поэтому оформление везде одинаковое.
#
# Шаблон описывает ТОЛЬКО раскладку. Как выглядят рамка, звёзды, кнопка и
# бейдж — решает выбранная версия составляющей: kind: part ссылается на тип,
# версия приходит в запросе на генерацию.
#
# Нейросети отдаётся единственный слой — kind: image_gen. Всё остальное
# берётся из библиотеки и потому не галлюцинирует.

id: card
name: Карточка коллекции (одна, для доводки)
canvas_w: 512
canvas_h: 720
background: "#00000000"

layers:
  # Цветная подложка — берётся из палитры варианта
  - id: matte
    kind: solid
    z: 0
    color: "${palette.0}"
    box: { x: 0, y: 0, w: 512, h: 720 }

  # Арт предмета — единственная генерация на карточке
  - id: art
    kind: image_gen
    z: 10
    prompt_slot: art
    category: "1"
    fit: cover
    box: { x: 36, y: 92, w: 440, h: 470 }

  # Рамка из библиотеки
  - id: frame
    kind: part
    part: frame
    z: 20
    box: { x: 0, y: 0, w: 512, h: 720 }

  # Звёзды редкости: файл выбирается по количеству
  - id: stars
    kind: part
    part: stars
    part_asset: "${rarity}.png"
    z: 30
    box: { x: 128, y: 28, w: 256, h: 72 }

  # Плашка под название
  - id: nameplate
    kind: part
    part: nameplate
    z: 30
    box: { x: 56, y: 588, w: 400, h: 84 }

  # Бейдж «+N» в углу
  - id: badge
    kind: part
    part: badge
    z: 35
    box: { x: 384, y: 24, w: 104, h: 104 }

  # Название — рисуется шрифтом из версии составляющей font,
  # генератору не отдаётся никогда
  - id: title
    kind: text
    z: 40
    text_slot: title
    box: { x: 66, y: 600, w: 380, h: 60 }
    style:
      size: 40
      color: "#FFF3D0"
      stroke_color: "#5A2E00"
      stroke_width: 5
      align: center
      uppercase: true
      max_lines: 1
