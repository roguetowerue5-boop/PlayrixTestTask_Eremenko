# LoRA на стиль Icons — ТОЛЬКО FLUX.1 [dev] + LoRA через fal.
# Триггер plrxcard ставится первым словом промпта (см. VariantConfig.trigger).
# Откатов на OpenRouter/Gemini для арта НЕТ: если fal недоступен — ошибка routing.
#
# Включить:
#   1. FAL_KEY в .env / secrets
#   2. providers.yaml → fal_lora.enabled: true + URL .safetensors + scale
#   3. Выбрать пресет «LoRA (Icons)» в наполнении

variants:
  default:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.7
    default_params:
      temperature: 0.7
      max_tokens: 4096
      reasoning:
        effort: none
    timeout: 120

  brief:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.3
    default_params:
      temperature: 0.3
      max_tokens: 2000
      reasoning:
        effort: none
    timeout: 90

  critic:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.1
    default_params:
      temperature: 0.1
      max_tokens: 800
      reasoning:
        effort: none
    timeout: 90

  concept:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 1.0
    default_params:
      temperature: 1.0
      max_tokens: 8000
      reasoning:
        effort: none
    timeout: 180

  render:
    trigger: plrxcard
    model_name: flux-lora
    model_params:
    - name: flux-lora
      provider_id: fal_lora
      size: 1024x1024
      n_reference_images: 0
    default_params: {}
    timeout: 300
