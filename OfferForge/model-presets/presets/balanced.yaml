# Баланс — заметно лучше концепт/vision, арт чуть дороже бюджета.
# Ориентир: ~$0.12 за страницу, ~$0.01 за картинку.
# Роли UI: default, brief, concept, critic (🎲), render.

variants:
  default:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.7
    - name: deepseek/deepseek-v4-flash-0731
      provider_id: openrouter
      temperature: 0.7
    default_params:
      temperature: 0.7
      max_tokens: 4096
      reasoning:
        effort: none
    timeout: 120

  brief:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.3
    - name: openai/gpt-5.6-luna
      provider_id: openrouter
      temperature: 0.3
    default_params:
      temperature: 0.3
      max_tokens: 2000
      reasoning:
        effort: none
    timeout: 90

  concept:
    model_name: minimax/minimax-m3
    model_params:
    - name: minimax/minimax-m3
      provider_id: openrouter
      temperature: 1.0
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 1.0
    - name: deepseek/deepseek-v4-flash-0731
      provider_id: openrouter
      temperature: 1.0
    default_params:
      temperature: 1.0
      max_tokens: 12000
      reasoning:
        effort: none
    timeout: 240

  critic:
    model_name: openai/gpt-5.6-luna
    model_params:
    - name: openai/gpt-5.6-luna
      provider_id: openrouter
      temperature: 0.1
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.1
    - name: minimax/minimax-m3
      provider_id: openrouter
      temperature: 0.1
    default_params:
      temperature: 0.1
      max_tokens: 1000
      reasoning:
        effort: none
    timeout: 120

  render:
    model_name: black-forest-labs/flux.2-pro
    model_params:
    - name: black-forest-labs/flux.2-pro
      provider_id: openrouter_images
      size: 1024x1024
      n_reference_images: 4
    - name: google/gemini-2.5-flash-image
      provider_id: openrouter_images
      size: 1024x1024
      n_reference_images: 1
    - name: black-forest-labs/flux.2-klein-4b
      provider_id: openrouter_images
      size: 1024x1024
      n_reference_images: 4
    default_params: {}
    timeout: 240
