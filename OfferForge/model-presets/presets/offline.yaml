# Оффлайн — весь пайплайн на mock-провайдере, без сети и без ключей.
# Роли UI: default, brief, concept, critic (🎲), render.

variants:
  default:
    model_name: mock-text
    model_params:
      - { name: mock-text, provider_id: mock }
    default_params: { temperature: 0.7, max_tokens: 4096 }
    timeout: 30

  brief:
    model_name: mock-text
    model_params: [{ name: mock-text, provider_id: mock }]
    default_params: {}
    timeout: 30

  concept:
    model_name: mock-text
    model_params: [{ name: mock-text, provider_id: mock }]
    default_params: {}
    timeout: 30

  critic:
    model_name: mock-vision
    model_params: [{ name: mock-vision, provider_id: mock }]
    default_params: {}
    timeout: 30

  render:
    model_name: mock-image
    model_params: [{ name: mock-image, provider_id: mock, size: 1024x1024 }]
    default_params: {}
    timeout: 30
