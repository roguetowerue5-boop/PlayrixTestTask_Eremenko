# Бюджет — минимум цены на наполнение коллекции (brief + concept + 10 images).
# Ориентир: ~$0.05 за страницу, ~$0.004 за картинку (flux.2-klein / qwen-image).
# Роли UI: default, brief, concept, critic (🎲), render.

variants:
  default:
    model_name: deepseek/deepseek-v4-flash-0731
    model_params:
    - name: deepseek/deepseek-v4-flash-0731
      provider_id: openrouter
      temperature: 0.7
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.7
    default_params:
      temperature: 0.7
      max_tokens: 4096
      reasoning:
        effort: none
    timeout: 120

  brief:
    model_name: deepseek/deepseek-v4-flash-0731
    model_params:
    - name: deepseek/deepseek-v4-flash-0731
      provider_id: openrouter
      temperature: 0.3
      reasoning:
        effort: none
    - name: openai/gpt-5.6-luna
      provider_id: openrouter
      temperature: 0.3
    default_params:
      temperature: 0.3
      max_tokens: 2000
      reasoning:
        effort: none
    timeout: 90

  concept:
    model_name: deepseek/deepseek-v4-flash-0731
    model_params:
    - name: deepseek/deepseek-v4-flash-0731
      provider_id: openrouter
      temperature: 1.0
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 1.0
    default_params:
      temperature: 1.0
      max_tokens: 8000
      reasoning:
        effort: none
    timeout: 180

  # Vision для кнопки 🎲 (name_from_art)
  critic:
    model_name: google/gemini-3.5-flash-lite
    model_params:
    - name: google/gemini-3.5-flash-lite
      provider_id: openrouter
      temperature: 0.1
    - name: openai/gpt-5.6-luna
      provider_id: openrouter
      temperature: 0.1
    default_params:
      temperature: 0.1
      max_tokens: 800
      reasoning:
        effort: none
    timeout: 90

  render:
    model_name: black-forest-labs/flux.2-klein-4b
    model_params:
    - name: black-forest-labs/flux.2-klein-4b
      provider_id: openrouter_images
      size: 1024x1024
      n_reference_images: 4
    - name: qwen/qwen-image-3
      provider_id: openrouter_images
      size: 1024x1024
      n_reference_images: 4
    - name: google/gemini-2.5-flash-image
      provider_id: openrouter_images
      size: 1024x1024
      n_reference_images: 1
    default_params: {}
    timeout: 240
