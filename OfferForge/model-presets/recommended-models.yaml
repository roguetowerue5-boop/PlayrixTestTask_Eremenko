# Модели, которые интерфейс подсказывает в поле «Модель» для каждого варианта.
# Все ID сверены с живой выгрузкой openrouter.ai/api/v1/models на 06.08.2026.
# Цены в комментариях: текст — $/1M токенов вход/выход, картинки — $/изображение.
#
# Синтаксис записи — обязателен только id, остальное применяется к слоту
# ротации при выборе модели в интерфейсе:
#
#   - id: qwen/qwen3.7-flash
#     provider_id: openrouter
#     temperature: 0.7
#     size: 1024x1024            # только для image-вариантов
#     n_reference_images: 6      # только для image-вариантов

# Порядок внутри варианта: сначала открытые веса, потом западные —
# чтобы ротация перекрывала разные юрисдикции. Модель под ограничением
# провайдера отдаёт HTTP 403, и цепочка из одного семейства падает целиком.

brief:
  - id: deepseek/deepseek-v4-flash-0731     # 0.09 / 0.18, открытая, json-mode
    provider_id: openrouter
    temperature: 0.3
  - id: openai/gpt-5.6-luna                 # 0.10 / 0.60, другая юрисдикция
    provider_id: openrouter
    temperature: 0.3
  - id: google/gemini-3.5-flash-lite        # 0.30 / 2.50
    provider_id: openrouter
    temperature: 0.3
  - id: qwen/qwen3.7-flash                  # 0.03 / 0.13, самая дешёвая,
    provider_id: openrouter                 # но бывает закрыта политикой
    temperature: 0.3

concept:
  - id: minimax/minimax-m3                  # 0.30 / 1.20, открытая
    provider_id: openrouter
    temperature: 1.0
  - id: deepseek/deepseek-v4-flash-0731     # 0.09 / 0.18, открытая
    provider_id: openrouter
    temperature: 1.0
  - id: google/gemini-3.5-flash-lite        # 0.30 / 2.50
    provider_id: openrouter
    temperature: 1.0
  - id: anthropic/claude-opus-5             # дорого, но лучший разброс идей
    provider_id: openrouter
    temperature: 1.0

copy:
  - id: deepseek/deepseek-v4-flash-0731     # 0.09 / 0.18, открытая
    provider_id: openrouter
    temperature: 0.8
  - id: openai/gpt-5.6-luna                 # 0.10 / 0.60
    provider_id: openrouter
    temperature: 0.8
  - id: anthropic/claude-sonnet-5
    provider_id: openrouter
    temperature: 0.9

# ТОЛЬКО модели с поддержкой картинок на входе. Текстовая модель здесь
# не соберётся, а без критика пайплайн теряет автономность целиком.
# DeepSeek остаётся text-only и в публичном API, и на OpenRouter —
# поэтому его в этом варианте нет и быть не может.
critic:
  - id: minimax/minimax-m3                  # 0.30 / 1.20, открытая, vision
    provider_id: openrouter
    temperature: 0.1
  - id: openai/gpt-5.6-luna                 # 0.10 / 0.60, vision, дешевле
    provider_id: openrouter
    temperature: 0.1
  - id: google/gemini-3.5-flash-lite        # 0.30 / 2.50, vision
    provider_id: openrouter
    temperature: 0.1
  - id: qwen/qwen3.7-flash                  # 0.03 / 0.13, vision, самая дешёвая
    provider_id: openrouter
    temperature: 0.1
  - id: anthropic/claude-sonnet-5           # дороже, но самый придирчивый
    provider_id: openrouter
    temperature: 0.1

# Все перечисленные принимают референсные изображения — без этого
# 30 карточек одного набора расползутся по стилю.
render:
  - id: black-forest-labs/flux.2-klein-4b   # 0.0044/img, референсы + seed
    provider_id: openrouter_images
    size: 1024x1024
    n_reference_images: 4
  - id: qwen/qwen-image-3                   # 0.0030/img, дешевле, но бывает
    provider_id: openrouter_images          # закрыта политикой провайдера
    size: 1024x1024
    n_reference_images: 4
  - id: krea/krea-2-medium-turbo            # 0.0046/img, без seed
    provider_id: openrouter_images
    size: 1024x1024
    n_reference_images: 4
  - id: black-forest-labs/flux.2-pro        # 0.0095/img, референсы + seed
    provider_id: openrouter_images
    size: 1024x1024
    n_reference_images: 4
  - id: openai/gpt-image-1-mini             # 0.0103/img
    provider_id: openrouter_images
    size: 1024x1024
  - id: bytedance-seed/seedream-4.5         # 0.0124/img — обрати внимание на
    provider_id: openrouter_images          # префикс bytedance-seed, не bytedance
    size: 1024x1024
    n_reference_images: 4
  - id: google/gemini-3.1-flash-image       # 0.0774/img, дорогая и сильная
    provider_id: openrouter_images
    size: 1024x1024
    n_reference_images: 1
